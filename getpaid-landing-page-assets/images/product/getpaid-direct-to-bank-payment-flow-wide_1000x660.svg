<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660"><g font-family="Arial, sans-serif"><rect x="1" y="1" width="998" height="658" rx="30" fill="white" stroke="#DFE7E3"/><text x="60" y="80" font-size="32" font-weight="700" fill="#0B1630">Straight to your bank.</text><text x="60" y="118" font-size="20" fill="#617066">Payment and confirmation take separate paths.</text><rect x="70" y="175" width="220" height="190" rx="24" fill="#ECFAF2"/><circle cx="180" cy="225" r="19" stroke="#00854A" stroke-width="5" fill="none"/><path d="M145 283v-15c0-32 70-32 70 0v15" stroke="#00854A" stroke-width="5" fill="none"/><text x="180" y="330" text-anchor="middle" font-size="23" font-weight="700" fill="#0B1630">Customer</text><rect x="710" y="175" width="220" height="190" rx="24" fill="#ECFAF2"/><path d="M780 232l40-25 40 25z M780 286h80 M790 242v34m20-34v34m20-34v34m20-34v34" stroke="#00854A" stroke-width="5" fill="none"/><text x="820" y="330" text-anchor="middle" font-size="23" font-weight="700" fill="#0B1630">Your bank</text><path d="M320 260h355m-17-17 17 17-17 17" stroke="#00854A" stroke-width="5" fill="none"/><text x="495" y="230" text-anchor="middle" font-size="20" fill="#00854A">UPI payment</text><path d="M820 385v65H500" stroke="#9AAEA3" stroke-width="3" stroke-dasharray="8 7" fill="none"/><rect x="70" y="425" width="430" height="100" rx="20" fill="#0B1630"/><text x="100" y="466" font-size="21" fill="white" font-weight="700">getpaid verifies payment</text><text x="100" y="500" font-size="18" fill="#A9EBC7">Signed webhook to your server</text><text x="70" y="588" font-size="19" fill="#617066">Funds go to your account. getpaid sends the confirmation.</text></g></svg>